name: Deploy TUFF BEATZ to Hestia

on:
  push:
    branches:
      - main
    paths:
      - "tuff-beatz/**"
      - ".github/workflows/deploy-hestia.yml"
  workflow_dispatch:

concurrency:
  group: tuff-beatz-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy WordPress Theme
    runs-on: ubuntu-latest

    env:
      # The Hestia account is SFTP-only. Use a path relative to the Hestia user's home.
      TUFF_BEATZ_REMOTE_THEME: web/tuffbeatz.com/public_html/wp-content/themes/tuff-beatz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        shell: bash
        env:
          HESTIA_SSH_KEY: ${{ secrets.HESTIA_SSH_KEY }}
          HESTIA_PORT: ${{ secrets.HESTIA_PORT }}
          HESTIA_HOST: ${{ secrets.HESTIA_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HESTIA_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$HESTIA_PORT" "$HESTIA_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test Hestia SFTP connection
        shell: bash
        run: |
          set -euo pipefail
          printf 'pwd\nls\nquit\n' | sftp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -P "${{ secrets.HESTIA_PORT }}" \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}"

      - name: Verify remote TUFF BEATZ theme directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'ls %s\nquit\n' "$TUFF_BEATZ_REMOTE_THEME" | sftp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -P "${{ secrets.HESTIA_PORT }}" \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}"

      - name: Deploy theme over SFTP
        shell: bash
        run: |
          set -euo pipefail
          # OpenSSH scp uses the SFTP protocol by default, so it works with an
          # SFTP-only Hestia account and does not require remote shell access.
          scp -r \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -P "${{ secrets.HESTIA_PORT }}" \
            tuff-beatz/. \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}:$TUFF_BEATZ_REMOTE_THEME/"

      - name: Verify deployed Site Editor
        shell: bash
        run: |
          set -euo pipefail
          printf 'ls %s/inc/site-editor.php\nls %s/front-page.php\nquit\n' \
            "$TUFF_BEATZ_REMOTE_THEME" "$TUFF_BEATZ_REMOTE_THEME" | sftp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -P "${{ secrets.HESTIA_PORT }}" \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}"

      - name: Deployment complete
        run: echo "TUFF BEATZ theme deployed to tuffbeatz.com successfully over SFTP."
